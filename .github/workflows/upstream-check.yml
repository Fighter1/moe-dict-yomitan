name: Upstream check

# Weekly: compare dict/sources.json with the MOE download pages and the g0v repository.
#   - A newer MOE sheet or a changed 兩岸詞典 sheet is downloaded into dict/ and proposed as a
#     pull request (branch upstream-sources). "Build and check" is started on that branch, so the
#     pull request shows whether the new sheets build and validate.
#   - A source that is no longer offered upstream cannot be replaced automatically; it opens or
#     refreshes an issue.
# Opening the pull request needs "Allow GitHub Actions to create and approve pull requests"
# (Settings → Actions → General).

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write # to start "Build and check" on the branch and to keep this schedule enabled

concurrency:
  group: upstream-check
  # a run that is cancelled between pushing the branch and opening the pull request would leave
  # the branch without one
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      BRANCH: upstream-sources
      ISSUE_TITLE: Upstream sources changed
      BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        # the script only needs jszip; no package's install script has to run for it
        run: npm ci --ignore-scripts

      - name: Compare dict/sources.json with upstream and fetch newer sheets
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }} # raises the GitHub API rate limit
        run: |
          node scripts/upstream-check.ts --update
          cat reports/upstream.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the pull request
        if: steps.check.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "$BOT_EMAIL"
          git checkout -B "$BRANCH"
          git add -A dict
          existing=""
          if git fetch --depth=1 origin "$BRANCH" 2> /dev/null; then existing="$(git rev-parse FETCH_HEAD)"; fi
          if [ -n "$existing" ] && git diff --cached --quiet "$existing" -- dict; then
            echo "the $BRANCH branch already has these sheets"
            tip="$existing"
          elif [ -n "$existing" ] && [ "$(git log -1 --format=%ce "$existing")" != "$BOT_EMAIL" ]; then
            # someone pushed to the branch (a parser fix for the new sheets, say): leave it alone
            echo "::warning::$BRANCH has commits that are not from this workflow and other sheets than upstream offers now; merge or delete it"
            tip="$existing"
          else
            git commit -m "Update the source sheets"
            git push --force origin "HEAD:refs/heads/$BRANCH"
            tip="$(git rev-parse HEAD)"
          fi
          # Pull requests of this repository only: --head also matches a fork's branch of that name.
          prs="$(gh pr list --head "$BRANCH" --state all --json number,state,headRefOid,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)]')"
          open="$(jq -r '[.[] | select(.state == "OPEN")][0].number // empty' <<< "$prs")"
          proposed="$(jq --arg tip "$tip" '[.[] | select(.headRefOid == $tip)] | length' <<< "$prs")"
          if [ -n "$open" ]; then
            gh pr edit "$open" --body-file reports/upstream.md
          elif [ "$proposed" = "0" ]; then # a pull request for this very commit that was closed by hand stays closed
            if ! gh pr create --head "$BRANCH" --title "Update the source sheets" --body-file reports/upstream.md; then
              echo "::error::the $BRANCH branch is pushed, but the pull request could not be opened; allow GitHub Actions to create pull requests (Settings → Actions → General) or open it from the branch"
              exit 1
            fi
          fi
          # A pull request opened with the workflow token does not start other workflows, so the
          # build is started here; its result is attached to the branch's commit.
          if [ "$(gh run list --workflow ci.yml --commit "$tip" --json databaseId --jq length)" = "0" ]; then
            gh workflow run ci.yml --ref "$BRANCH"
          fi

      - name: Open or update the issue
        if: steps.check.outputs.manual == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            --jq "[.[] | select(.title == \"$ISSUE_TITLE\")][0].number // empty")"
          if [ -z "$number" ]; then
            gh issue create --title "$ISSUE_TITLE" --body-file reports/upstream.md
          else
            gh issue edit "$number" --body-file reports/upstream.md
          fi

      - name: Close the issue when everything is current
        if: steps.check.outputs.newer == 'false' && steps.check.outputs.manual == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            --jq "[.[] | select(.title == \"$ISSUE_TITLE\")][0].number // empty")"
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "The sources in \`dict/sources.json\` are current again."
          fi

      - name: Keep the schedule enabled
        # GitHub disables scheduled workflows of a repository without activity for 60 days,
        # which is exactly when this check is the only thing watching the sources.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/upstream-check.yml/enable"
